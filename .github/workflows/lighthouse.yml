name: Lighthouse

# Performance, accessibility and SEO budgets, enforced on every change.
#
# Pages that rank also have to load, and a regression here is invisible until
# somebody happens to run Lighthouse by hand months later. The thresholds and
# the reasoning behind them live in lighthouserc.js.
#
# On a failure this opens an issue rather than only going red, so the finding
# survives past the pull request that caused it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The build reads these for the RAG and comment features. Empty values
          # are fine: those routes are dynamic and are not audited here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Lighthouse CI
        id: lhci
        run: npx --yes @lhci/cli@0.14.x autorun

      - name: Open an issue on regression
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = 'Lighthouse budget failed on main'

            // One open issue at a time. A new one per commit would bury the
            // first failure, which is the one that says what broke.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'lighthouse',
            })

            const body = [
              `Lighthouse assertions failed on ${context.sha.slice(0, 7)}.`,
              '',
              `Run: ${run}`,
              '',
              'The job log lists which assertion failed and links a full report.',
              'Thresholds and the reasoning behind them: `lighthouserc.js`.',
            ].join('\n')

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['lighthouse'],
              })
            }
