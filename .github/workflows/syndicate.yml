name: Syndicate

# Cross-post to dev.to and Hashnode when a post changes on main.
#
# The workflow will not push anything unless BOTH of these hold:
#   - the run is on main (a pull request only ever gets a dry run), and
#   - the platform's secret is present in the repository.
#
# Missing secrets are not an error. The dry run is genuinely useful on its own:
# it prints which posts would be created and which already exist, which is the
# check you want before handing the job real credentials.
#
# Publishing to third-party platforms from CI is gated on `workflow_dispatch`
# with publish=true, so it is never a side effect of merging. Since September
# 2026 the publish-scheduled workflow makes that dispatch for each scheduled
# post the day after it goes live; a manual dispatch still works as before.

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'lib/post-markdown.mjs'
      - 'scripts/syndicate.mjs'
  pull_request:
    paths:
      - 'content/blog/**'
      - 'lib/post-markdown.mjs'
      - 'scripts/syndicate.mjs'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually push to dev.to and Hashnode'
        type: boolean
        default: false
      post:
        description: 'Limit to these post slugs, space separated (optional)'
        type: string

# Runs queue rather than overlap: each publish run commits syndication.json,
# and two at once would race on the push.
concurrency:
  group: syndicate-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dry run
        if: github.event_name != 'workflow_dispatch' || inputs.publish != true
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          POSTS: ${{ inputs.post }}
        run: |
          if [ -z "$POSTS" ]; then node scripts/syndicate.mjs; exit; fi
          for slug in $POSTS; do node scripts/syndicate.mjs --post "$slug"; done

      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          POSTS: ${{ inputs.post }}
        run: |
          if [ -z "$POSTS" ]; then node scripts/syndicate.mjs --publish; exit; fi
          failed=0
          for slug in $POSTS; do node scripts/syndicate.mjs --publish --post "$slug" || failed=1; done
          exit $failed

      # The state file records which remote article belongs to which post. If it
      # is lost, the next run re-creates every article as a duplicate, so it is
      # committed straight back rather than left as a build artefact. Even when
      # the publish step failed: one platform failing (Hashnode, say) must not
      # throw away the record of what another platform already published.
      - name: Commit syndication state
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: |
          if git diff --quiet -- data/syndication.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/syndication.json
          git commit -m "chore(syndication): record cross-post ids"
          git pull --rebase --quiet
          git push
