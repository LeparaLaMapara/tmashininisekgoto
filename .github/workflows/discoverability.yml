name: Discoverability

# The gates that keep the site findable, understandable and honest.
#
# On every pull request and push to main: build the site, serve the
# production build, crawl it (titles, descriptions, self canonicals, noindex,
# h1, alt text, JSON-LD validity, orphans, sitemap consistency, broken
# internal links) and run the content graph tests (ontology, evidence pins,
# identity, connections) and the retrieval evaluation. Any error fails the run.
#
# Weekly: check every external evidence and identity link, report GitHub
# repository metadata, and crawl production itself, so a regression in the
# deployed site or a link rotting somewhere else is caught without anyone
# remembering to look. A failure opens one issue, or comments on the open one.
#
# Performance and accessibility budgets live in lighthouse.yml.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # Mondays, 07:17 SAST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap reads each page's last commit date from git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Serve the production build
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Crawl the site
        run: node scripts/discoverability/audit-site.mjs --base http://localhost:3000 --json crawl-report.json

      - name: Content graph, evidence and retrieval tests
        run: npx playwright test tests/graph.spec.ts tests/retrieval-eval.spec.ts tests/schedule.spec.ts --reporter=line
        env:
          PLAYWRIGHT_WEB_SERVER: npm start

      - name: Keep the crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report
          path: crawl-report.json

  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: External evidence and identity links, GitHub metadata
        id: external
        run: npx tsx scripts/discoverability/check-external.ts --json external-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crawl production
        id: production
        if: always()
        run: node scripts/discoverability/audit-site.mjs --base https://www.tmashininisekgoto.com --json production-crawl.json

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-discoverability
          path: |
            external-report.json
            production-crawl.json

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = 'Weekly discoverability check failed'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'discoverability',
            })
            const open = existing.data.find((i) => i.title === title)
            const body = `A broken evidence link, a production crawl error, or both. Reports are attached to ${run}.`
            if (open) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['discoverability'] })
            }
